# Search across every collection, and the status filter.
appId: app.grailbox
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Collections"
    timeout: 10000
- tapOn:
    id: "dashboard-settings"
- tapOn:
    id: "settings-seed"
- tapOn:
    id: "dashboard-search"
- inputText: "shelf b"
- assertVisible: "3 items"
- eraseText
- inputText: "pokemon"
- assertVisible: "Rowlet Jumbo Plush"
- hideKeyboard
- eraseText
- tapOn: "Filter by status"
- tapOn: "Wishlist"
- assertVisible: "Rowlet Juggling Plush"
- assertVisible: "Rowlet Enamel Pin"
- assertNotVisible: "Rowlet Jumbo Plush"
